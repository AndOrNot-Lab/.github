<svg width="460" height="92" viewBox="0 0 460 92" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">AND - Connect</title>
  <style>
    :root { --bg:#eefbf2; --line:#aceebb; --accent:#1a7f37; --ink:#144b26; }
    @media (prefers-color-scheme:dark) { :root { --bg:#11261a; --line:#255c35; --accent:#3fb950; --ink:#aff5bd; } }
    .label { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  </style>
  <rect x="1" y="1" width="458" height="90" rx="7" fill="var(--bg)" stroke="var(--line)" />
